function show(id){if(cockpit)cockpit.visible=false;if(id!='hud')$('warn').style.display=$('vig').style.display='none';['home','garage','settings','pause','hud'].forEach(s=>$(s).classList.toggle('on',s==id))}

 h+=`</div><div class="row">Colour <input type="color" value="${col()}" oninput="setCol(this.value,1)">${SW.map(c=>`<button class="sw" style="background:${c}" onclick="setCol('${c}')"></button>`).join('')}</div>`;
 h+='<div class="row">Design '+DES.map((d,i)=>`<button class="${(S.des[S.car]|0)==i?'':'s'}" onclick="setDes(${i})">${d}</button>`).join('')+'</div>';

 h+='<div class="row">Upgrades '+['Engine','Handling','Armor','Nitro tank'].map((n,i)=>`<button class="s" onclick="upg(${i})">${n} Lv${S.up[i]} ${S.up[i]<5?'· 🪙'+200*(S.up[i]+1):'· MAX'}</button>`).join('')+'</div>';
 $('gar').innerHTML=h;document.querySelectorAll('.gc').forEach(e=>e.textContent=S.coins)}

function setChr(k,v,f){S.chr[k]=v;setPlayer();sv();if(!f)gar()}

onkeydown=e=>{if(e.target.tagName=='INPUT')return;aud();const k=e.code;if(k=='ArrowLeft'||k=='KeyA')KEY.l=1;if(k=='ArrowRight'||k=='KeyD')KEY.r=1;if(['Space','ShiftLeft','ShiftRight','KeyW','ArrowUp'].includes(k))KEY.n=1;
 if(k=='KeyC')camMode();if(k=='Escape'||k=='KeyP')state=='play'?pauseG():state=='pause'&&resume();if(k.startsWith('Arrow')||k=='Space')e.preventDefault()};
onkeyup=e=>{const k=e.code;if(k=='ArrowLeft'||k=='KeyA')KEY.l=0;if(k=='ArrowRight'||k=='KeyD')KEY.r=0;if(['Space','ShiftLeft','ShiftRight','KeyW','ArrowUp'].includes(k))KEY.n=0};
[['tl','l'],['tr','r'],['tn','n']].forEach(([id,k])=>{const e=$(id);e.onpointerdown=()=>{aud();KEY[k]=1};e.onpointerup=e.onpointerleave=e.onpointercancel=()=>KEY[k]=0});
onpointerdown=aud;onresize=()=>ap();document.onvisibilitychange=()=>{if(document.hidden)pauseG()};

let last=performance.now();

 if(state!='pause'){tod+=dt/150;
  if(state=='play'||state=='over'){if(state=='play')play(dt)}

  if(state=='over'){const c=CARS[S.car];ps+=v*dt;v*=Math.pow(.05,dt)}

   if(p.l<0){scn.remove(p.m);if(p.sp)p.m.material.dispose();PA.splice(i,1)}}

 const dl=cl(Math.sin(tod*6.2832)*1.6+.4,0,1),sk=new THREE.Color(0x05071a).lerp(new THREE.Color(0x87c8f0),dl),tn=cl(1-Math.abs(dl-.4)/.4,0,1)*.45*(1-Math.abs(dl-.4)*.2);
 sk.lerp(new THREE.Color(0xff8a3d),tn);const dk=map.dark?1:0;scn.fog=new THREE.Fog(sk,dk?10+40*dl:50,FAR[S.set.gfx]*(dk?.28+.72*dl:1));skyU.bot.value.copy(sk);skyU.top.value.copy(sk).multiplyScalar(.5).lerp(new THREE.Color(0x1a56b0),dl*.55);
 dome.position.copy(cam.position);const dr=new THREE.Vector3(.25,Math.sin(tod*6.2832)*.75+.05,-.9).normalize();

 amb.intensity=(dk?.03:.22)+.5*dl;sun.intensity=(dk?.01:.08)+.8*dl;sun.color.setHex(dl>.5?0xfff4e0:0x8fa8ff);hl.intensity=(1-dl)*(dk?.4:1.2);spot.intensity=(1-dl)*(dk?3.4:2.4);const nt=1-dl;HLM.opacity=LGM.opacity=nt*.9;BEAM.opacity=nt*.12;LPM.opacity=nt*.55;hills.position.set(cam.position.x,0,cam.position.z);
 const lp=SC.filter(o=>o.lamp&&o.s>ps-6).sort((a,b)=>a.s-b.s);LL.forEach((l,i)=>{const o=lp[i];if(o){l.position.set(o.position.x-o.side*1.7,7,o.position.z);l.intensity=nt*2.4}else l.intensity=0});
 if(pl){sun.position.set(pl.position.x+dr.x*50,Math.max(25,dr.y*70),pl.position.z+dr.z*50+25);sun.target.position.copy(pl.position);spot.position.set(pl.position.x,1.2,pl.position.z-1);spot.target.position.set(pl.position.x,0,pl.position.z-40);rail.material.color.setScalar(.25+.65*dl)}
 R.render(scn,cam)}
setMap(S.map|0);setPlayer();ap();renderHome();requestAnimationFrame(loop);
