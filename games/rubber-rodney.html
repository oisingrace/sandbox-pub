<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Rubber Rodney</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
<style>
  /* Layout: full-bleed photographic studio; quiet glass HUD in the top corners; a tray of tools along the bottom. */
  :root {
    --ground: #121110;
    --glass: rgba(18, 17, 16, .62);
    --glass-hi: rgba(255, 250, 244, .1);
    --line: rgba(255, 250, 244, .14);
    --text: #f1ece6;
    --dim: #a59d94;
    --warm: #e9b48f;
    --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--text); font-family: var(--sans); }
  #app { display: flex; flex-direction: column; height: 100%; }
  #stageWrap { position: relative; flex: 1; min-height: 0; background: var(--ground); }
  #gl, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { touch-action: none; cursor: crosshair; }

  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #hud { position: absolute; top: 14px; left: 16px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  #bucksPill { padding: 8px 12px 7px; display: flex; flex-direction: column; gap: 1px; min-width: 150px; }
  .label { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  #bucks { font-family: var(--mono); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #bucks::before { content: "$"; color: var(--warm); margin-right: 3px; }
  #bucksPill.bump #bucks { animation: bump .3s ease-out; }
  @keyframes bump { 40% { color: var(--warm); } }
  #malfPill { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
  #malfRow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  #malf { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
  #malfBar { display: block; height: 3px; border-radius: 2px; background: var(--glass-hi); overflow: hidden; }
  #malfFill { display: block; height: 100%; width: 0; background: var(--warm); transition: width .3s; }

  #utils { position: absolute; top: 14px; right: 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .util { display: flex; align-items: center; gap: 8px; font: 500 13px/1 var(--sans); color: var(--text); background: var(--glass); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px 7px 9px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .util svg { width: 17px; height: 17px; flex: none; }
  .util:hover { border-color: rgba(255,250,244,.4); }
  .util.on { background: var(--text); color: var(--ground); }
  .util:focus-visible, .tool:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }

  #hint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); max-width: min(440px, calc(100% - 360px)); text-align: center; font-size: 14px; line-height: 1.35; padding: 8px 14px; transition: opacity .5s; pointer-events: none; text-wrap: balance; }
  #hint.hide { opacity: 0; }
  #toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(12px); opacity: 0; transition: .25s; font-size: 14px; font-weight: 500; padding: 8px 14px; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%); }

  #tools { flex: none; background: #0b0a0a; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; border-top: 1px solid var(--line); }
  .track { display: flex; gap: 6px; width: max-content; margin: 0 auto; padding-top: 6px; }
  .tool { position: relative; width: 72px; height: 68px; border-radius: 10px; border: 1px solid var(--line); background: #1a1817; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font: 500 11px/1.1 var(--sans); cursor: pointer; padding: 6px 2px 4px; transition: background .15s, border-color .15s; }
  .tool svg { width: 26px; height: 26px; }
  .tool:hover { border-color: rgba(255,250,244,.35); }
  .tool.active { background: var(--text); color: var(--ground); border-color: var(--text); }
  .tool.locked { color: var(--dim); background: #121110; }
  .tool.locked svg { opacity: .45; }
  .tool .price { position: absolute; top: -7px; right: -4px; background: var(--warm); color: var(--ground); font: 500 10.5px/1 var(--mono); padding: 3px 5px; border-radius: 5px; }
  .tool .key { position: absolute; top: 4px; left: 6px; font: 500 9.5px/1 var(--mono); opacity: .4; }
  .tool.deny { animation: deny .35s; }
  @keyframes deny { 20%,60% { transform: translateX(-4px); } 40%,80% { transform: translateX(4px); } }

  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 14px; pointer-events: none; padding: 0 16px; text-align: center; }

  @media (max-width: 680px) {
    .util span { display: none; }
    .util { padding: 8px; }
    #hint { top: auto; bottom: 14px; max-width: calc(100% - 32px); width: max-content; font-size: 12.5px; }
    #toast { bottom: 64px; }
    #bucksPill, #malfPill { min-width: 120px; }
    #bucks { font-size: 20px; }
    .tool { width: 62px; height: 62px; }
    .tool svg { width: 22px; height: 22px; }
    .tool .key { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tool, #toast, #hint { transition: none; animation: none; }
  }
</style>
</head>
<body>
<script type="application/json" id="patch-notes">
[
  { "version": "1.0", "date": "2026-10-06", "title": "Meet Rodney",
    "notes": [
      "A rubbery 3D man in a photo studio to stretch, squash, dent and blow up.",
      "Grab his face or body and the skin stretches, then wobbles back when you let go. Pull keeps the stretch.",
      "11 toys: Hand, Mallet, Pull, Thumbtack, Bomb, Air Pump, Bowling Ball, Feather, Anvil, Rocket and Magnet.",
      "Earn $ for every hit and spend it on new toys, or switch on Free play.",
      "Reform puts him back in shape. Gravity, slow-mo and sound switches in the top corner.",
      "Keyboard: 1-9 and 0/- pick tools, R reforms, G changes gravity, S slow-mo, M mutes."
    ] }
]
</script>
<div id="app">
  <div id="stageWrap">
    <canvas id="gl"></canvas>
    <canvas id="overlay" aria-label="Rubber Rodney play area"></canvas>
    <div id="loading">Setting up the studio…</div>
    <div id="hud">
      <div class="glass" id="bucksPill" title="Money"><span id="bucks">0</span></div>
      <div class="glass" id="malfPill"><div id="malfRow"><span class="label">Malformed</span><span id="malf">0%</span></div><span id="malfBar"><span id="malfFill"></span></span></div>
    </div>
    <div id="utils">
      <button class="util" id="uReform" type="button" aria-label="Reform Rodney (R)" title="Reform Rodney (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 9a8 8 0 1 0 1 6"/><path d="M20 3v6h-6"/></svg><span>Reform</span></button>
      <button class="util" id="uGrav" type="button" aria-label="Change gravity (G)" title="Change gravity (G)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v17M6 14l6 6 6-6"/></svg><span id="gravLabel">Gravity: on</span></button>
      <button class="util" id="uSlow" type="button" aria-label="Slow motion (S)" title="Slow motion (S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 8v5l3 2M9 2h6"/></svg><span>Slow-mo</span></button>
      <button class="util" id="uSound" type="button" aria-label="Sound (M)" title="Sound (M)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="waves" d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg><span id="soundLabel">Sound</span></button>
      <button class="util" id="uClear" type="button" aria-label="Clear toys from the studio" title="Clear toys from the studio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13"/></svg><span>Clear toys</span></button>
      <button class="util" id="uFree" type="button" aria-label="Free play: every toy unlocked" title="Free play: every toy unlocked">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg><span>Free play</span></button>
    </div>
    <div class="glass" id="hint">Grab Rodney's face and pull. Pick other toys from the tray below.</div>
    <div class="glass" id="toast"></div>
  </div>
  <nav id="tools" aria-label="Toys"><div class="track" id="track"></div></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE) { document.getElementById('loading').textContent = 'The 3D engine could not load. Check your connection and reload.'; return; }
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const g2 = (x, y, cx, cy, sx, sy) => { const a = (x - cx) / sx, b = (y - cy) / sy; return Math.exp(-0.5 * (a * a + b * b)); };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------- DOM ----------------
const wrap = document.getElementById('stageWrap');
const glCanvas = document.getElementById('gl');
const ov = document.getElementById('overlay');
const octx = ov.getContext('2d');
const bucksEl = document.getElementById('bucks');
const bucksPill = document.getElementById('bucksPill');
const malfEl = document.getElementById('malf');
const malfFill = document.getElementById('malfFill');
const hintEl = document.getElementById('hint');
const toastEl = document.getElementById('toast');
const track = document.getElementById('track');

// ---------------- save ----------------
const SAVE_KEY = 'rubber-rodney-v1';
let save = { bucks: 60, unlocked: ['hand', 'mallet', 'taffy'], free: false, muted: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ---------------- audio ----------------
let AC = null, master = null, noiseBuf = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = save.muted ? 0 : 0.6; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!AC || save.muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, ftype, f0, f1, q = 1, delay = 0) {
  if (!AC || save.muted) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = ftype; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  thud(v = 1) { tone('sine', 120, 42, 0.2, 0.6 * v); noise(0.1, 0.25 * v, 'lowpass', 600, 120); },
  slap(v = 1) { noise(0.07, 0.6 * v, 'bandpass', 1800, 700, 1.2); tone('sine', 180, 70, 0.12, 0.4 * v); },
  wobble(v = 1) { const f = rnd(70, 95); tone('sine', f * 1.6, f, 0.4, 0.35 * v); tone('sine', f * 2.4, f * 1.4, 0.25, 0.12 * v, 0.05); },
  bonk() { tone('sine', 160, 55, 0.22, 0.7); noise(0.06, 0.5, 'bandpass', 1400, 500, 1.5); },
  boom(v = 1) { noise(1.4 * v, 0.9 * v, 'lowpass', 1600, 40); tone('sine', 80, 25, 1.0, 0.85 * v); },
  pop() { noise(0.2, 0.9, 'highpass', 3000, 500); tone('sine', 700, 70, 0.12, 0.4); },
  clang() { [440, 1187, 1693, 2531, 3317].forEach((f, i) => tone('sine', f, f * 0.99, 1.6 - i * 0.25, 0.13)); tone('sine', 110, 45, 0.25, 0.5); },
  tick() { tone('square', 2200, 2200, 0.02, 0.04); },
  hiss() { noise(0.14, 0.1, 'bandpass', 2600, 4200, 1.2); },
  stretch() { noise(0.16, 0.12, 'bandpass', 300, 900, 3); },
  snap(v = 1) { tone('sine', 260, 60, 0.18, 0.45 * v); noise(0.05, 0.3 * v, 'bandpass', 2200, 900, 2); },
  pin() { tone('square', 2400, 1200, 0.03, 0.05); tone('sine', 260, 110, 0.08, 0.3); },
  whoosh() { noise(2.6, 0.32, 'bandpass', 400, 1600, 0.7); },
  buy() { [523, 659, 784].forEach((f, i) => tone('sine', f, f, 0.18, 0.18, i * 0.06)); },
  deny() { tone('sine', 150, 120, 0.2, 0.15); },
  coin() { tone('sine', 1568, 1568, 0.08, 0.05); },
  throw() { noise(0.22, 0.14, 'bandpass', 500, 1500, 1); }
};

// ---------------- layout ----------------
let W = 800, H = 600, DPR = 1, floorY = 540;

// ---------------- physics world (screen pixels, y down) ----------------
const SUBS = 2, ITERS = 6, G = 0.55;
let h = 0.5, slowmo = false, gravMode = 0;
const pts = [], cons = [], parts = [];
let props = [], rockets = [], pulls = [];
let fella = null;
let frameImpact = 0, impactX = 0, impactY = 0;
let frameNo = 0;

function addP(x, y, im, r, part) {
  const p = { x, y, px: x, py: y, im, im0: im, r, part, plastic: 0, lvx: 0, lvy: 0, pin: null, held: false, isCenter: false };
  pts.push(p); return p;
}
function link(a, b, k, part, kind) {
  const d = Math.hypot(b.x - a.x, b.y - a.y);
  const c = { a, b, rest: d, rest0: d, k, part, kind };
  cons.push(c); if (part) part.cons.push(c); return c;
}
function polyArea(ring) {
  let a = 0; const n = ring.length;
  for (let i = 0; i < n; i++) { const p = ring[i], q = ring[(i + 1) % n]; a += p.x * q.y - q.x * p.y; }
  return a / 2;
}
function makeBlob(name, cx, cy, rx, ry, n, taper = 0) {
  const b = { type: 'blob', name, inflate: 1, popped: false, ring: [], cons: [], n };
  b.center = addP(cx, cy, 0.7, 4, b); b.center.isCenter = true;
  for (let i = 0; i < n; i++) { const a = i / n * TAU; b.ring.push(addP(cx + Math.cos(a) * rx * (1 - taper * Math.sin(a)), cy + Math.sin(a) * ry, 1, 3, b)); }
  for (let i = 0; i < n; i++) {
    link(b.ring[i], b.ring[(i + 1) % n], 0.9, b, 'edge');
    link(b.center, b.ring[i], 0.14, b, 'spoke');
    link(b.ring[i], b.ring[(i + 2) % n], 0.08, b, 'bend');
  }
  b.area0 = polyArea(b.ring); b.target = b.area0;
  parts.push(b); return b;
}
function makeLimb(name, root, segs, thick, end) {
  const L = { type: 'limb', name, pts: [root], cons: [], thick, inflate: 1, popped: false, end };
  let x = root.x, y = root.y;
  for (const [dx, dy] of segs) { x += dx; y += dy; L.pts.push(addP(x, y, 1, thick / 2, L)); }
  link(L.pts[0], L.pts[1], 0.9, L, 'bone');
  link(L.pts[1], L.pts[2], 0.9, L, 'bone');
  link(L.pts[0], L.pts[2], 0.035, L, 'bendy');
  parts.push(L); return L;
}
function buildFella(cx, cy) {
  pts.length = 0; cons.length = 0; parts.length = 0; rockets = []; pulls = [];
  const S = SC;
  const torso = makeBlob('torso', cx, cy, 42 * S, 56 * S, 16, 0.16);
  const head = makeBlob('head', cx, cy - 102 * S, 40 * S, 50 * S, 18, 0.08);
  const hr = head.ring, tr = torso.ring;
  link(head.center, torso.center, 0.5, null, 'neck');
  link(hr[4], tr[13], 0.6, null, 'neck'); link(hr[5], tr[11], 0.6, null, 'neck');
  link(hr[4], tr[11], 0.3, null, 'neck'); link(hr[5], tr[13], 0.3, null, 'neck');
  const legL = makeLimb('left leg', tr[5], [[-6 * S, 38 * S], [-2 * S, 36 * S]], 22 * S, 'shoe');
  const legR = makeLimb('right leg', tr[3], [[6 * S, 38 * S], [2 * S, 36 * S]], 22 * S, 'shoe');
  const armL = makeLimb('left arm', tr[9], [[-20 * S, 30 * S], [-8 * S, 32 * S]], 16 * S, 'hand');
  const armR = makeLimb('right arm', tr[15], [[20 * S, 30 * S], [8 * S, 32 * S]], 16 * S, 'hand');
  legL.side = -1; legR.side = 1; armL.side = -1; armR.side = 1;
  head.color = 'skin'; torso.color = 'shirt'; armL.color = armR.color = 'skin'; legL.color = legR.color = 'pants';
  fella = { head, torso, legL, legR, armL, armR, limbs: [legL, legR, armL, armR] };
  updateLimbRadii();
}
const SC = 1.4; // overall size of Rodney
function limbThick(L) { return L.popped ? 6 * SC : L.thick * L.inflate; }
function updateLimbRadii() {
  for (const L of fella.limbs) {
    const t = limbThick(L);
    L.pts[1].r = t / 2;
    L.pts[2].r = L.end === 'hand' ? Math.max(t / 2, L.popped ? 6 * SC : 10 * SC * Math.min(L.inflate, 2.2)) : Math.max(t / 2, 10 * SC);
  }
}
function effRest(c) {
  const pt = c.part;
  if (pt && pt.type === 'blob') { if (pt.popped) return c.kind === 'spoke' ? c.rest * 0.4 : c.rest; return c.rest * pt.inflate; }
  return c.rest;
}
function effK(c) {
  const pt = c.part;
  if (pt && pt.type === 'blob' && pt.popped) { if (c.kind === 'spoke') return 0.02; if (c.kind === 'bend') return 0.01; }
  return c.k;
}
function solve(c) {
  const a = c.a, b = c.b, w = a.im + b.im; if (!w) return;
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
  const s = effK(c) * (d - effRest(c)) / d / w;
  a.x += dx * s * a.im; a.y += dy * s * a.im;
  b.x -= dx * s * b.im; b.y -= dy * s * b.im;
}
function addVel(o, vx, vy) { o.px -= vx * h; o.py -= vy * h; }
function velOf(o) { return [(o.x - o.px) / h, (o.y - o.py) / h]; }
function setH(nh) {
  const s = nh / h;
  for (const o of pts) { o.px = o.x - (o.x - o.px) * s; o.py = o.y - (o.y - o.py) * s; }
  for (const o of props) { o.px = o.x - (o.x - o.px) * s; o.py = o.y - (o.y - o.py) * s; }
  h = nh;
}
function gravity() { return gravMode === 0 ? G : gravMode === 1 ? 0 : -G; }
function applyPressure(b) {
  if (b.popped) return;
  const A = polyArea(b.ring), T = b.target * b.inflate * b.inflate;
  const dP = clamp((T - A) / T, -0.5, 1.5) * 1.6 * h * h;
  const n = b.ring.length;
  for (let i = 0; i < n; i++) {
    const p = b.ring[i], q = b.ring[(i + 1) % n];
    const nx = q.y - p.y, ny = -(q.x - p.x);
    p.x += nx * dP * p.im * 0.5; p.y += ny * dP * p.im * 0.5;
    q.x += nx * dP * q.im * 0.5; q.y += ny * dP * q.im * 0.5;
  }
}

// ---------------- props ----------------
function makeProp(kind, x, y) {
  const o = { kind, x, y, px: x, py: y, angle: 0, held: false, born: frameNo };

// ---------------- plasticity, pain, mood ----------------

const floats = [];

    rk.mesh.position.set(wx(rk.p.x - dx * 4), wy(rk.p.y - dy * 4), rk.z);
    _v.set(dx, -dy, 0); rk.mesh.quaternion.setFromUnitVectors(_v2.set(0, 1, 0), _v);
    rk.mesh.flame.visible = rk.lit && rk.fuel > 0; rk.mesh.flame.scale.y = rnd(0.8, 1.3);
  }
  const pinned = pts.filter(p => p.pin);
  while (tackMeshes.length < pinned.length) tackMeshes.push(tackMesh());
  tackMeshes.forEach((m, i) => { const p = pinned[i]; m.visible = !!p; if (p) m.position.set(wx(p.x), wy(p.y), p.part.type === 'blob' ? 10 : 14); });
  // cursor tools
  const showCursor = ptr.inside && (ptr.mouse || ptr.down);
  malletMesh.visible = showCursor && tool === 'mallet';
  if (malletMesh.visible) {
    // the head lands on the pointer at the bottom of the swing (angle 1.1)
    const t = mallet ? mallet.t : 99;
    const ang = t < 4 ? lerp(0.2, 1.1, t / 4) : t < 18 ? 1.1 - (t - 4) / 14 * 0.6 : 0.5;
    malletMesh.position.set(wx(ptr.x) + 88 * Math.sin(1.1), wy(ptr.y) - 88 * Math.cos(1.1), 45);
    malletMesh.rotation.set(0, 0, ang);
  }
  magnetMesh.visible = showCursor && tool === 'magnet';
  if (magnetMesh.visible) { magnetMesh.position.set(wx(ptr.x), wy(ptr.y) + 4, 60); magnetMesh.rotation.set(0.3, 0, Math.PI); }
  featherMesh.visible = showCursor && tool === 'feather';
  if (featherMesh.visible) { featherMesh.position.set(wx(ptr.x), wy(ptr.y), 50); featherMesh.rotation.set(0.2, 0.4 + Math.sin(frameNo * 0.2) * 0.3, -0.6 + Math.sin(frameNo * 0.3) * 0.25); }
  const tc = fella.torso.center;
  key.target.position.lerp(_v.set(wx(tc.x), wy(tc.y) * 0.6, 0), 0.08);
  renderParticles();
}

function placeCamera() {
  const camY = floorY - H / 2;
  const D = (H / 2) / Math.tan(FOV / 2 * Math.PI / 180);
  const sx = shakeAmt > 0.3 ? rnd(-shakeAmt, shakeAmt) : 0, sy = shakeAmt > 0.3 ? rnd(-shakeAmt, shakeAmt) : 0;
  camera.position.set(sx, camY + sy, D);
  camera.lookAt(sx, camY + sy, 0);
  camera.near = D * 0.1; camera.far = D * 6; camera.updateProjectionMatrix();
}

// ---------------- resize & loop ----------------
function resize() {
  const r = wrap.getBoundingClientRect();
  const oldFloor = floorY;
  W = Math.max(200, r.width); H = Math.max(200, r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  ov.width = Math.round(W * DPR); ov.height = Math.round(H * DPR);
  renderer.setPixelRatio(DPR); renderer.setSize(W, H, false);
  camera.aspect = W / H;
  floorY = H - clamp(H * 0.13, 50, 100);
  if (pts.length) {
    const dy = floorY - oldFloor;
    for (const p of pts) { p.y += dy; p.py += dy; p.x = clamp(p.x, p.r, W - p.r); p.px = clamp(p.px, p.r, W - p.r); if (p.pin) { p.pin.y += dy; p.pin.x = clamp(p.pin.x, 4, W - 4); } }
    for (const o of props) { o.y += dy; o.py += dy; }
  }
  placeCamera();
}

let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(100, now - last); last = now; acc += dt;
  ptr.vx = ptr.x - ptr.lx; ptr.vy = ptr.y - ptr.ly; ptr.lx = ptr.x; ptr.ly = ptr.y;
  if (skinGrab && skinGrab.held) {
    const s = skinGrab, sv = Math.min(0.97, Math.hypot(s.fx, s.fy));
    const p = surfaceAt(s.blob, Math.atan2(s.fy, s.fx), sv, false);
    s.ox = lerp(s.ox, clamp(ptr.x - p[0], -420, 420), 0.5); s.oy = lerp(s.oy, clamp(ptr.y - p[1], -420, 420), 0.5);
    s.oz = lerp(s.oz, Math.min(40, Math.hypot(s.ox, s.oy) * 0.12), 0.3);
  }
  let n = 0;
  while (acc >= 1000 / 60 && n < 4) { step(); acc -= 1000 / 60; n++; }
  if (n === 4) acc = 0;
  syncScene();
  placeCamera();
  renderer.render(scene, camera);
  drawOverlay();
  requestAnimationFrame(loop);
}

function init() {
  resize();
  buildFella(W / 2, floorY - 156 * SC);
  makeBlobMesh(fella.head, 0.92, headColor, faceRelief, skinMat);
  makeBlobMesh(fella.torso, 0.62, torsoColor, null, clothMat);
  const skinC = new THREE.Color(COL.skin), shirtC = new THREE.Color(COL.shirt), pantsC = new THREE.Color(COL.pants);
  for (const L of [fella.armL, fella.armR]) makeLimbMesh(L, limbSkinMat, t => t < 0.3 ? shirtC : skinC);
  for (const L of [fella.legL, fella.legR]) makeLimbMesh(L, legMat, () => pantsC);
  blobState(fella.head); blobState(fella.torso);
  bucksEl.textContent = save.bucks;
  buildTools(); selectTool('hand', true); hint("Grab Rodney's face and pull. Pick other toys from the tray below.");
  document.getElementById('uFree').classList.toggle('on', save.free);
  if (save.muted) { document.getElementById('uSound').classList.add('on'); document.getElementById('soundLabel').textContent = 'Muted'; document.getElementById('waves').style.display = 'none'; }
  updateMalformed();
  new ResizeObserver(() => resize()).observe(wrap);
  document.getElementById('loading').remove();
  requestAnimationFrame(loop);
}
init();
})();
</script>
</body>
