<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Rubber Rodney</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
<style>
  /* Layout: full-bleed photographic studio; quiet glass HUD in the top corners; a tray of tools along the bottom. */
  :root {
    --ground: #121110;
    --glass: rgba(18, 17, 16, .62);
    --glass-hi: rgba(255, 250, 244, .1);
    --line: rgba(255, 250, 244, .14);
    --text: #f1ece6;
    --dim: #a59d94;
    --warm: #e9b48f;
    --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--text); font-family: var(--sans); }
  #app { display: flex; flex-direction: column; height: 100%; }
  #stageWrap { position: relative; flex: 1; min-height: 0; background: var(--ground); }
  #gl, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #stageWrap::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 55%, transparent 55%, rgba(8, 7, 6, .45)); }
  #overlay { touch-action: none; cursor: crosshair; }

  #hud, #utils, #hint, #toast, #loading { z-index: 1; }
  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #hud { position: absolute; top: 14px; left: 16px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  #bucksPill { padding: 8px 12px 7px; display: flex; flex-direction: column; gap: 1px; min-width: 150px; }
  .label { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  #bucks { font-family: var(--mono); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #bucks::before { content: "$"; color: var(--warm); margin-right: 3px; }
  #bucksPill.bump #bucks { animation: bump .3s ease-out; }
  @keyframes bump { 40% { color: var(--warm); } }
  #malfPill { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
  #malfRow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  #malf { font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
  #malfBar { display: block; height: 3px; border-radius: 2px; background: var(--glass-hi); overflow: hidden; }
  #malfFill { display: block; height: 100%; width: 0; background: var(--warm); transition: width .3s; }

  #utils { position: absolute; top: 14px; right: 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .util { display: flex; align-items: center; gap: 8px; font: 500 13px/1 var(--sans); color: var(--text); background: var(--glass); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px 7px 9px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .util svg { width: 17px; height: 17px; flex: none; }
  .util:hover { border-color: rgba(255,250,244,.4); }
  .util.on { background: var(--text); color: var(--ground); }
  .util[hidden], #liquidPop[hidden] { display: none; }
  .util .swatch { width: 15px; height: 15px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1.5px rgba(255,250,244,.55); }
  #liquidPop { position: absolute; right: calc(100% + 8px); display: grid; grid-template-columns: repeat(3, 28px); gap: 8px; padding: 10px; }
  #liquidPop .sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  #liquidPop .sw.on { border-color: var(--text); }
  #liquidPop input { width: 28px; height: 28px; border: 0; padding: 4px; background: conic-gradient(#e0412f, #f2b630, #3fbf5a, #2fd1c4, #2f8fe0, #a04fe0, #ff6fb0, #e0412f); cursor: pointer; border-radius: 50%; }
  #liquidPop input::-webkit-color-swatch-wrapper { padding: 0; }
  #liquidPop input::-webkit-color-swatch { border: 2px solid #1a1817; border-radius: 50%; }
  #liquidPop input::-moz-color-swatch { border: 2px solid #1a1817; border-radius: 50%; }
  .util:focus-visible, .tool:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }

  #hint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); max-width: min(440px, calc(100% - 360px)); text-align: center; font-size: 14px; line-height: 1.35; padding: 8px 14px; transition: opacity .5s; pointer-events: none; text-wrap: balance; }
  #hint.hide { opacity: 0; }
  #toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(12px); opacity: 0; transition: .25s; font-size: 14px; font-weight: 500; padding: 8px 14px; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%); }

  #tools::-webkit-scrollbar { height: 6px; }
  #tools::-webkit-scrollbar-thumb { background: rgba(255,250,244,.18); border-radius: 3px; }
  #tools { flex: none; background: #0b0a0a; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; border-top: 1px solid var(--line); }
  .track { display: flex; gap: 6px; width: max-content; margin: 0 auto; padding-top: 6px; }
  .tool { position: relative; width: 72px; height: 68px; border-radius: 10px; border: 1px solid var(--line); background: #1a1817; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font: 500 11px/1.1 var(--sans); cursor: pointer; padding: 6px 2px 4px; transition: background .15s, border-color .15s, color .15s; }
  .tool svg { width: 26px; height: 26px; }
  .tool:hover { border-color: rgba(255,250,244,.35); }
  .tool.active { background: var(--text); color: var(--ground); border-color: var(--text); }
  .tool.locked { color: var(--dim); background: #121110; }
  .tool.locked svg { opacity: .45; }
  .tool .price { position: absolute; top: -7px; right: -4px; background: var(--warm); color: var(--ground); font: 500 10.5px/1 var(--mono); padding: 3px 5px; border-radius: 5px; }
  .tool .key { position: absolute; top: 4px; left: 6px; font: 500 9.5px/1 var(--mono); opacity: .4; }
  .tool.deny { animation: deny .35s; }
  @keyframes deny { 20%,60% { transform: translateX(-4px); } 40%,80% { transform: translateX(4px); } }

  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 14px; pointer-events: none; padding: 0 16px; text-align: center; }

  @media (max-width: 680px) {
    .util span { display: none; }
    .util { padding: 8px; }
    #hint { top: auto; bottom: 14px; max-width: calc(100% - 32px); width: max-content; font-size: 12.5px; }
    #toast { bottom: 84px; }
    #bucksPill, #malfPill { min-width: 120px; }
    #bucks { font-size: 20px; }
    .tool { width: 62px; height: 62px; }
    .tool svg { width: 22px; height: 22px; }
    .tool .key { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tool, #toast, #hint { transition: none; animation: none; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="stageWrap">
    <canvas id="gl"></canvas>
    <canvas id="overlay" aria-label="Rubber Rodney play area"></canvas>
    <div id="loading">Setting up the studio…</div>
    <div id="hud">
      <div class="glass" id="bucksPill" title="Money"><span id="bucks">0</span></div>
      <div class="glass" id="malfPill"><div id="malfRow"><span class="label">Malformed</span><span id="malf">0%</span></div><span id="malfBar"><span id="malfFill"></span></span></div>
    </div>
    <div id="utils">
      <button class="util" id="uReform" type="button" aria-label="Reset everything (R)" title="Reset everything (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 9a8 8 0 1 0 1 6"/><path d="M20 3v6h-6"/></svg><span>Reset</span></button>
      <button class="util" id="uReverse" type="button" aria-label="Reverse the tools (V, or hold Shift)" title="Reverse the tools (V, or hold Shift / right-click)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4M3 8h13M17 12l4 4-4 4M21 16H8"/></svg><span>Reverse</span></button>
      <button class="util" id="uChar" type="button" aria-label="Switch to Balloon Boy (B)" title="Switch between Rodney and Balloon Boy (B)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="9" rx="6" ry="7"/><path d="M12 16l-1.2 1.6h2.4zM9 7.5v.01M15 7.5v.01M9.5 11c1.4 1.2 3.6 1.2 5 0"/></svg><span>Balloon Boy</span></button>
      <button class="util" id="uLiquid" type="button" hidden aria-label="Liquid colour (C)" title="Liquid colour (C)" aria-expanded="false">
        <i class="swatch" id="liquidSwatch"></i><span>Liquid</span></button>
      <div class="glass" id="liquidPop" hidden></div>
      <button class="util" id="uGrav" type="button" aria-label="Change gravity (G)" title="Change gravity (G)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v17M6 14l6 6 6-6"/></svg><span id="gravLabel">Gravity: on</span></button>
      <button class="util" id="uSlow" type="button" aria-label="Slow motion (S)" title="Slow motion (S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 8v5l3 2M9 2h6"/></svg><span>Slow-mo</span></button>
      <button class="util" id="uSound" type="button" aria-label="Sound (M)" title="Sound (M)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="waves" d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg><span id="soundLabel">Sound</span></button>
      <button class="util" id="uClear" type="button" aria-label="Clear toys from the studio" title="Clear toys from the studio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13"/></svg><span>Clear toys</span></button>
      <button class="util" id="uFree" type="button" aria-label="Free play: every toy unlocked" title="Free play: every toy unlocked">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg><span>Free play</span></button>
    </div>
    <div class="glass" id="hint">Grab Rodney's face and pull. Pick other toys from the tray below.</div>
    <div class="glass" id="toast"></div>
  </div>
  <nav id="tools" aria-label="Toys"><div class="track" id="track"></div></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE) { document.getElementById('loading').textContent = 'The 3D engine could not load. Check your connection and reload.'; return; }
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const g2 = (x, y, cx, cy, sx, sy) => { const a = (x - cx) / sx, b = (y - cy) / sy; return Math.exp(-0.5 * (a * a + b * b)); };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------- DOM ----------------
const wrap = document.getElementById('stageWrap');
const glCanvas = document.getElementById('gl');
const ov = document.getElementById('overlay');
const octx = ov.getContext('2d');
const bucksEl = document.getElementById('bucks');
const bucksPill = document.getElementById('bucksPill');
const malfEl = document.getElementById('malf');
const malfFill = document.getElementById('malfFill');
const hintEl = document.getElementById('hint');
const toastEl = document.getElementById('toast');
const track = document.getElementById('track');
// a mouse wheel scrolls the long tray sideways
document.getElementById('tools').addEventListener('wheel', e => {
  const el = e.currentTarget; if (Math.abs(e.deltaY) <= Math.abs(e.deltaX) || el.scrollWidth <= el.clientWidth) return;
  el.scrollLeft += e.deltaY; e.preventDefault();
}, { passive: false });

// ---------------- save ----------------
const SAVE_KEY = 'rubber-rodney-v1';
let save = { bucks: 60, unlocked: ['hand', 'mallet', 'taffy'], free: false, muted: false, char: 'rodney', liquid: 0x2f8fe0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ---------------- audio ----------------
let AC = null, master = null, noiseBuf = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = save.muted ? 0 : 0.6; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!AC || save.muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, ftype, f0, f1, q = 1, delay = 0) {
  if (!AC || save.muted) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = ftype; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  thud(v = 1) { tone('sine', 120, 42, 0.2, 0.6 * v); noise(0.1, 0.25 * v, 'lowpass', 600, 120); },
  slap(v = 1) { noise(0.07, 0.6 * v, 'bandpass', 1800, 700, 1.2); tone('sine', 180, 70, 0.12, 0.4 * v); },
  wobble(v = 1) { const f = rnd(70, 95); tone('sine', f * 1.6, f, 0.4, 0.35 * v); tone('sine', f * 2.4, f * 1.4, 0.25, 0.12 * v, 0.05); },
  bonk() { tone('sine', 160, 55, 0.22, 0.7); noise(0.06, 0.5, 'bandpass', 1400, 500, 1.5); },
  boom(v = 1) { noise(1.4 * v, 0.9 * v, 'lowpass', 1600, 40); tone('sine', 80, 25, 1.0, 0.85 * v); },
  pop() { noise(0.2, 0.9, 'highpass', 3000, 500); tone('sine', 700, 70, 0.12, 0.4); },
  clang() { [440, 1187, 1693, 2531, 3317].forEach((f, i) => tone('sine', f, f * 0.99, 1.6 - i * 0.25, 0.13)); tone('sine', 110, 45, 0.25, 0.5); },
  tick() { tone('square', 2200, 2200, 0.02, 0.04); },
  hiss() { noise(0.14, 0.1, 'bandpass', 2600, 4200, 1.2); },
  stretch() { noise(0.16, 0.12, 'bandpass', 300, 900, 3); },
  snap(v = 1) { tone('sine', 260, 60, 0.18, 0.45 * v); noise(0.05, 0.3 * v, 'bandpass', 2200, 900, 2); },
  pin() { tone('square', 2400, 1200, 0.03, 0.05); tone('sine', 260, 110, 0.08, 0.3); },
  whoosh() { noise(2.6, 0.32, 'bandpass', 400, 1600, 0.7); },
  buy() { [523, 659, 784].forEach((f, i) => tone('sine', f, f, 0.18, 0.18, i * 0.06)); },
  deny() { tone('sine', 150, 120, 0.2, 0.15); },
  coin() { tone('sine', 1568, 1568, 0.08, 0.05); },
  throw() { noise(0.22, 0.14, 'bandpass', 500, 1500, 1); },
  boing(v = 1) { const f = rnd(180, 240); tone('sine', f, f * 2.6, 0.22, 0.3 * v); tone('triangle', f * 0.5, f * 1.4, 0.3, 0.12 * v, 0.02); },
  punch() { noise(0.09, 0.8, 'lowpass', 2200, 300, 0.8); tone('sine', 140, 45, 0.2, 0.7); },
  zap() { noise(0.5, 0.5, 'highpass', 6000, 1200, 0.7); tone('sawtooth', 120, 60, 0.45, 0.12); noise(0.9, 0.35, 'lowpass', 900, 60, 0.7, 0.05); },
  buzz() { tone('square', rnd(90, 130), 70, 0.05, 0.035); },
  hum() { tone('sine', 55, 48, 0.4, 0.18); },
  warp() { tone('sine', 900, 60, 0.8, 0.25); noise(0.8, 0.2, 'bandpass', 3000, 200, 2); },
  squeak() { tone('sine', 900, 1400, 0.12, 0.08); tone('sine', 1200, 800, 0.1, 0.06, 0.1); },
  splat() { noise(0.35, 0.7, 'lowpass', 1400, 120, 1); tone('sine', 90, 40, 0.25, 0.5); },
  piano(v = 1) {
    [55, 82.4, 98, 116.5, 146.8, 174.6, 207.6, 293.7].forEach((f, i) => { const g = f * pick([1, 1.06, 0.94]); tone('triangle', g, g * 0.995, 2.2 - i * 0.15, 0.09 * v, i * 0.012); tone('sine', g * 2, g * 2, 1.2, 0.04 * v, i * 0.012); });
    noise(0.3, 0.6 * v, 'lowpass', 800, 80); tone('sine', 70, 30, 0.5, 0.7 * v);
  }
};

// ---------------- layout ----------------
let W = 800, H = 600, DPR = 1, floorY = 540;

// ---------------- physics world (screen pixels, y down) ----------------
const SUBS = 2, ITERS = 6, G = 0.55;
let h = 0.5, slowmo = false, gravMode = 0;
let isBB = false; // Balloon Boy: a softer, heavier body full of liquid
const LIQUIDS = [0x2f8fe0, 0xe0412f, 0x3fbf5a, 0xf2b630, 0xa04fe0, 0xff6fb0, 0x2fd1c4, 0xf07a2a, 0xf4f1ea]; // Balloon Boy's liquid colours
const pts = [], cons = [], parts = [];
let props = [], rockets = [], pulls = [];
let fella = null;
let frameImpact = 0, impactX = 0, impactY = 0;
let frameNo = 0;

function addP(x, y, im, r, part) {
  const p = { x, y, px: x, py: y, im, im0: im, r, part, plastic: 0, lvx: 0, lvy: 0, pin: null, held: false, isCenter: false };
  pts.push(p); return p;
}

// A pull moves a patch of a blob's surface, addressed in "face disk" coordinates (fx, fy),

    p.m.visible = p.life > 0; if (!p.m.visible) continue;
    p.m.position.set(wx(p.x), 0.6, p.z); p.m.scale.set(p.r * p.sx, 1, p.r * 0.7);
    p.m.material.opacity = 0.75 * Math.min(1, p.life / 300);
  }
  flashSprite.material.opacity = flashT;
}

// ---------- overlay (2D: aiming, gauges, money) ----------
function drawOverlay() {
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.clearRect(0, 0, W, H);
  octx.lineCap = 'round'; octx.lineJoin = 'round';
  if (ptr.inside && (ptr.mouse || ptr.down)) {
    const x = ptr.x, y = ptr.y;
    if (tool === 'anvil' || tool === 'piano' || tool === 'wreck') {
      octx.setLineDash([3, 7]); octx.strokeStyle = 'rgba(255,250,244,.35)'; octx.lineWidth = 1.5;
      octx.beginPath(); octx.moveTo(x, 0); octx.lineTo(x, tool === 'wreck' ? fella.torso.center.y : floorY); octx.stroke(); octx.setLineDash([]);
    } else if (tool === 'tramp') {
      octx.setLineDash([3, 7]); octx.strokeStyle = 'rgba(255,250,244,.4)'; octx.lineWidth = 1.5;
      const tx = clamp(x, 80, W - 80); octx.beginPath(); octx.ellipse(tx, floorY - 2, 78, 10, 0, 0, TAU); octx.stroke(); octx.setLineDash([]);
    } else if (tool === 'blower' && blowing) {
      const tc = fella.torso.center, a0 = Math.atan2(tc.y - y, tc.x - x);
      octx.strokeStyle = 'rgba(255,250,244,.22)'; octx.lineWidth = 1.5;
      for (let k = 0; k < 7; k++) {
        const a = a0 + (k - 3) * 0.09, r0 = (((rev() ? -frameNo : frameNo) * 9 + k * 53) % 260 + 260) % 260 + 40;
        octx.beginPath(); octx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); octx.lineTo(x + Math.cos(a) * (r0 + 46), y + Math.sin(a) * (r0 + 46)); octx.stroke();
      }
    } else if ((tool === 'ball' || tool === 'melon') && aim) {
      const vx = clamp((aim.x - x) * 0.22, -45, 45), vy = clamp((aim.y - y) * 0.22, -45, 45);
      octx.fillStyle = 'rgba(255,250,244,.55)';
      let sx = aim.x, sy = aim.y, svy = vy;
      for (let k = 0; k < 22; k++) { sx += vx * 0.8; sy += svy * 0.8; svy += gravity() * 0.8; octx.beginPath(); octx.arc(sx, sy, 2.2 * (1 - k / 26), 0, TAU); octx.fill(); }
      octx.strokeStyle = 'rgba(255,250,244,.3)'; octx.lineWidth = 1.5; octx.beginPath(); octx.moveTo(aim.x, aim.y); octx.lineTo(x, y); octx.stroke();
    } else if (tool === 'magnet' && magnetOn) {
      for (let k = 0; k < 3; k++) { const r = rev() ? 140 - ((frameNo * 2 + k * 40) % 120) : ((frameNo * 2 + k * 40) % 120) + 20; octx.strokeStyle = `rgba(255,250,244,${0.25 * (1 - r / 140)})`; octx.lineWidth = 1.5; octx.beginPath(); octx.arc(x, y, 160 - r, 0, TAU); octx.stroke(); }
    } else if (tool === 'pump') {
      const part = pumping || partAt(x, y);
      if (part) {
        const lim = part.type === 'blob' ? 2.5 : 3.2, f = clamp((part.inflate - 1) / (lim - 1), 0, 1); // the bar shows how close it is to bursting
        octx.fillStyle = 'rgba(18,17,16,.7)'; octx.fillRect(x + 16, y - 6, 64, 6);
        octx.fillStyle = f > 0.75 ? '#e0533d' : '#e9b48f'; octx.fillRect(x + 16, y - 6, 64 * f, 6);
        octx.font = '500 11px "IBM Plex Mono", monospace'; octx.textAlign = 'left'; octx.textBaseline = 'alphabetic';
        octx.fillStyle = 'rgba(241,236,230,.85)'; octx.fillText(Math.round(part.inflate * 100) + '% air', x + 16, y - 12);
      }
    } else if ((tool === 'pin' || tool === 'rocket' || tool === 'balloon') && ptr.mouse) {
      const p = nearestPoint(x, y, tool === 'pin' ? 40 : 50, false);
      if (p) { octx.strokeStyle = 'rgba(255,250,244,.6)'; octx.lineWidth = 1.5; octx.beginPath(); octx.arc(p.x, p.y, 11, 0, TAU); octx.stroke(); }
    } else if ((tool === 'hand' || tool === 'taffy') && !grab && !skinGrab && ptr.mouse && partAt(x, y)) {
      octx.strokeStyle = 'rgba(255,250,244,.55)'; octx.lineWidth = 1.5; octx.beginPath(); octx.arc(x, y, 9, 0, TAU); octx.stroke();
    }
  }
  for (const b of bolts) {
    // lightning: a wide blue glow under a thin white core, fading fast
    const a = 1 - b.t / 12;
    for (const [wd, col] of [[10, `rgba(110,170,255,${0.25 * a})`], [4, `rgba(170,210,255,${0.6 * a})`], [1.6, `rgba(255,255,255,${a})`]]) {
      octx.strokeStyle = col; octx.lineWidth = wd; octx.beginPath();
      b.path.forEach(([px, py], k) => k ? octx.lineTo(px, py) : octx.moveTo(px, py)); octx.stroke();
    }
  }
  octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.font = '500 15px "IBM Plex Mono", monospace';
  for (const t of floats) {
    const a = t.t < 8 ? t.t / 8 : 1 - Math.max(0, (t.t - 35) / 20);
    octx.fillStyle = `rgba(233,180,143,${a})`; octx.shadowColor = 'rgba(0,0,0,.6)'; octx.shadowBlur = 6;
    octx.fillText(t.text, t.x, t.y);
  }
  octx.shadowBlur = 0;
}

// ---------- sync physics → scene ----------
function syncScene() {
  updateBlobMesh(fella.head); updateBlobMesh(fella.torso);
  for (const L of fella.limbs) updateLimbMesh(L);
  updateFace(); updateExtremities();
  if (isBB) {
    for (const k of ['head', 'torso', 'armL', 'armR', 'legL', 'legR']) liquidTint(fella[k], bMats[k]);
    liquidTint(null, bMats.plain);
  } else {
    inflateTint(fella.head, skinMat); inflateTint(fella.torso, clothMat);
    inflateTint(fella.armL.inflate > fella.armR.inflate ? fella.armL : fella.armR, limbSkinMat);
    inflateTint(fella.legL.inflate > fella.legR.inflate ? fella.legL : fella.legR, legMat);
    plainSkin.color.set(COL.skin).lerp(_soot, soot * 0.75);
  }
  for (const o of props) {
    if (!o.mesh) makePropMesh(o);
    o.mesh.position.set(wx(o.x), wy(o.y), 0);
    if (o.r && o.kind !== 'bomb') o.mesh.rotation.z = -o.angle;
    if (o.kind === 'tramp') { const b = Math.max(0, o.boing) / 14; o.mesh.bed.position.y = o.hh - 2 - Math.sin(b * Math.PI) * 10; }
    if (o.kind === 'bomb') { o.mesh.led.visible = !!(o.fuse < 50 ? (frameNo >> 2) % 2 : (frameNo >> 4) % 2); o.mesh.rotation.z = -(o.x - o.px) * 0.05; }
  }
  const live = new Set(props), liveR = new Set(rockets);
  for (const c of scene.children.slice()) {
    if (c.userData.prop && !live.has(c.userData.prop)) scene.remove(c);
    if (c.userData.rocket && !liveR.has(c.userData.rocket)) scene.remove(c);
  }
  for (const rk of rockets) {
    if (!rk.mesh) makeRocketMesh(rk);
    let dx = rk.dx, dy = rk.dy;
    if (dx === undefined) { const ref = partRef(rk.p); dx = rk.p.x - ref.x; dy = rk.p.y - ref.y; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d; }
    rk.z = rk.p.part.type === 'blob' ? 14 : 18;
    rk.mesh.position.set(wx(rk.p.x - dx * 4), wy(rk.p.y - dy * 4), rk.z);
    _v.set(dx, -dy, 0); rk.mesh.quaternion.setFromUnitVectors(_v2.set(0, 1, 0), _v);
    rk.mesh.flame.visible = rk.lit && rk.fuel > 0; rk.mesh.flame.scale.y = rnd(0.8, 1.3);
  }
  const pinned = pts.filter(p => p.pin);
  while (tackMeshes.length < pinned.length) tackMeshes.push(tackMesh());
  tackMeshes.forEach((m, i) => { const p = pinned[i]; m.visible = !!p; if (p) m.position.set(wx(p.x), wy(p.y), p.part.type === 'blob' ? 10 : 14); });
  // cursor tools
  const showCursor = ptr.inside && (ptr.mouse || ptr.down);
  malletMesh.visible = showCursor && tool === 'mallet';
  if (malletMesh.visible) {
    // the head lands on the pointer at the bottom of the swing (angle 1.1)
    const t = mallet ? mallet.t : 99;
    const ang = t < 4 ? lerp(0.2, 1.1, t / 4) : t < 18 ? 1.1 - (t - 4) / 14 * 0.6 : 0.5;
    malletMesh.position.set(wx(ptr.x) + 88 * Math.sin(1.1), wy(ptr.y) - 88 * Math.cos(1.1), 45);
    malletMesh.rotation.set(0, 0, ang);
  }
  magnetMesh.visible = showCursor && tool === 'magnet';
  if (magnetMesh.visible) { magnetMesh.position.set(wx(ptr.x), wy(ptr.y) + 4, 60); magnetMesh.rotation.set(0.3, 0, Math.PI); }
  featherMesh.visible = showCursor && tool === 'feather';
  if (featherMesh.visible) { featherMesh.position.set(wx(ptr.x), wy(ptr.y), 50); featherMesh.rotation.set(0.2, 0.4 + Math.sin(frameNo * 0.2) * 0.3, -0.6 + Math.sin(frameNo * 0.3) * 0.25); }
  gloveMesh.visible = !!glove;
  if (glove) {
    // out fast, hold, then pull back on the spring arm
    const t = glove.t, e = t < 6 ? t / 6 : t < 10 ? 1 : 1 - (t - 10) / 12;
    const sx = glove.from < 0 ? -40 : W + 40, gx = lerp(sx, glove.x - glove.from * 22, e);
    gloveMesh.position.set(wx(gx), wy(glove.y), 30);
    gloveMesh.rotation.set(0, glove.from < 0 ? 0 : Math.PI, 0);
    const armLen = Math.abs(gx - sx);
    gloveMesh.arm.scale.y = Math.max(1, armLen); gloveMesh.arm.position.x = -34 - armLen / 2;
  }
  blowerMesh.visible = showCursor && tool === 'blower';
  if (blowerMesh.visible) {
    const tcx = fella.torso.center.x, tcy = fella.torso.center.y;
    blowerMesh.position.set(wx(ptr.x), wy(ptr.y), 60);
    blowerMesh.rotation.set(0, 0, Math.atan2(-(tcy - ptr.y), tcx - ptr.x));
    blowerMesh.position.x -= Math.cos(blowerMesh.rotation.z) * 36; blowerMesh.position.y -= Math.sin(blowerMesh.rotation.z) * 36;
  }
  holeMeshes.forEach((m, i) => {
    const bh = holes[i]; m.visible = !!bh; if (!bh) return;
    if (!m.glow.material.map) { m.glow.material.map = dotTex; m.glow.material.needsUpdate = true; m.disk.material.map = dotTex; m.disk.material.needsUpdate = true; }
    const grow = smooth(0, 30, bh.t) * (1 - smooth(bh.life - 12, bh.life, bh.t) * 0.7);
    m.position.set(wx(bh.x), wy(bh.y), 20); m.scale.setScalar(26 * grow + 0.01);
    m.disk.rotation.z += bh.rev ? -0.08 : 0.08; m.glow.material.opacity = 0.35 + 0.15 * Math.sin(frameNo * 0.3);
    m.core.material.color.set(bh.rev ? 0xfff4e0 : 0x000000); m.disk.material.color.set(bh.rev ? 0xffc870 : 0x9a6bff); m.glow.material.color.set(bh.rev ? 0xffd9a0 : 0x6a3cff);
  });
  balloons.forEach((bl, i) => {
    const m = balloonMesh(i); m.visible = true; m.line.visible = true;
    m.mat.color.set(bl.color);
    m.position.set(wx(bl.x), wy(bl.y), 24); m.scale.setScalar(bl.r);
    m.rotation.z = clamp(-(bl.x - bl.p.x) / bl.len, -0.6, 0.6);
    const pa = m.line.geometry.attributes.position, x0 = bl.x, y0 = bl.y + bl.r * 1.4, x1 = bl.p.x, y1 = bl.p.y;
    const slack = Math.max(0, bl.len - Math.hypot(x1 - x0, y1 - y0));
    for (let k = 0; k <= 8; k++) { const t = k / 8; pa.setXYZ(k, wx(lerp(x0, x1, t) + Math.sin(t * Math.PI) * slack * 0.4), wy(lerp(y0, y1, t)), lerp(24, 16, t)); }
    pa.needsUpdate = true;
  });
  for (let i = balloons.length; i < balloonPool.length; i++) { balloonPool[i].visible = false; balloonPool[i].line.visible = false; }
  chain.visible = !!wreck;
  if (wreck) {
    const o = wreck.o, a3 = _v.set(wx(wreck.ax), wy(wreck.ay), 0), b3 = _v2.set(wx(o.x), wy(o.y - o.r - 6), 0);
    chain.position.copy(a3).add(b3).multiplyScalar(0.5); chain.scale.y = a3.distanceTo(b3);
    chain.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b3.clone().sub(a3).normalize());
  }
  const tc = fella.torso.center;
  key.target.position.lerp(_v.set(wx(tc.x), wy(tc.y) * 0.6, 0), 0.08);
  renderParticles();
}

function placeCamera() {
  const camY = floorY - H / 2;
  const D = (H / 2) / Math.tan(FOV / 2 * Math.PI / 180);
  const sx = shakeAmt > 0.3 ? rnd(-shakeAmt, shakeAmt) : 0, sy = shakeAmt > 0.3 ? rnd(-shakeAmt, shakeAmt) : 0;
  camera.position.set(sx, camY + sy, D);
  camera.lookAt(sx, camY + sy, 0);
  camera.near = D * 0.1; camera.far = D * 6; camera.updateProjectionMatrix();
}

// ---------------- resize & loop ----------------
function resize() {
  const r = wrap.getBoundingClientRect();
  const oldFloor = floorY;
  W = Math.max(200, r.width); H = Math.max(200, r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  ov.width = Math.round(W * DPR); ov.height = Math.round(H * DPR);
  renderer.setPixelRatio(DPR); renderer.setSize(W, H, false);
  camera.aspect = W / H;
  floorY = H - clamp(H * 0.13, 50, 100);
  if (pts.length) {
    const dy = floorY - oldFloor;
    for (const p of pts) { p.y += dy; p.py += dy; p.x = clamp(p.x, p.r, W - p.r); p.px = clamp(p.px, p.r, W - p.r); if (p.pin) { p.pin.y += dy; p.pin.x = clamp(p.pin.x, 4, W - 4); } }
    for (const o of props) { o.y += dy; o.py += dy; }
  }
  placeCamera();
}

let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(100, now - last); last = now; acc += dt;
  ptr.vx = ptr.x - ptr.lx; ptr.vy = ptr.y - ptr.ly; ptr.lx = ptr.x; ptr.ly = ptr.y;
  if (skinGrab && skinGrab.held) {
    const s = skinGrab, sv = Math.min(0.97, Math.hypot(s.fx, s.fy));
    const p = surfaceAt(s.blob, Math.atan2(s.fy, s.fx), sv, false);
    s.ox = lerp(s.ox, clamp(ptr.x - p[0], -420, 420), 0.5); s.oy = lerp(s.oy, clamp(ptr.y - p[1], -420, 420), 0.5);
    s.oz = lerp(s.oz, Math.min(40, Math.hypot(s.ox, s.oy) * 0.12), 0.3);
  }
  let n = 0;
  while (acc >= 1000 / 60 && n < 4) { step(); acc -= 1000 / 60; n++; }
  if (n === 4) acc = 0;
  syncScene();
  placeCamera();
  renderer.render(scene, camera);
  drawOverlay();
  requestAnimationFrame(loop);
}

function init() {
  resize();
  buildFella(W / 2, floorY - 156 * SC);
  makeBlobMesh(fella.head, 0.92, headColor, faceRelief, skinMat, 1.25);
  makeBlobMesh(fella.torso, 0.62, torsoColor, null, clothMat, 1);
  const skinC = new THREE.Color(COL.skin), shirtC = new THREE.Color(COL.shirt), pantsC = new THREE.Color(COL.pants);
  for (const L of [fella.armL, fella.armR]) makeLimbMesh(L, limbSkinMat, t => t < 0.3 ? shirtC : skinC);
  for (const L of [fella.legL, fella.legR]) makeLimbMesh(L, legMat, () => pantsC);
  blobState(fella.head); blobState(fella.torso);
  bucksEl.textContent = save.bucks;
  buildTools(); selectTool('hand', true); hint("Grab Rodney's face and pull. Pick other toys from the tray below.");
  document.getElementById('uFree').classList.toggle('on', save.free);
  if (save.muted) { document.getElementById('uSound').classList.add('on'); document.getElementById('soundLabel').textContent = 'Muted'; document.getElementById('waves').style.display = 'none'; }
  applyChar();
  updateMalformed();
  new ResizeObserver(() => resize()).observe(wrap);
  document.getElementById('loading').remove();
  requestAnimationFrame(loop);
}
init();
})();
</script>
