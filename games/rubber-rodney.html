<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Rubber Rodney</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;800&display=swap" />
<style>
  /* Layout: full-bleed padded-cell stage; HUD pinned to the top corners; a tray of tools along the bottom. */
  :root {
    --plum: #2b1b33;
    --plum-2: #3e2a4a;
    --cream: #fff1da;
    --sun: #ffc933;
    --rubber: #ff8a3d;
    --cobalt: #3c6df0;
    --tomato: #e2363c;
    --pad: #f2c5d3;
    --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--plum); color: var(--cream); font-family: var(--body); }
  #app { display: flex; flex-direction: column; height: 100%; }
  #stageWrap { position: relative; flex: 1; min-height: 0; background: var(--pad); }
  #stage { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

  #hud { position: absolute; top: 12px; left: 16px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .pill { background: rgba(43, 27, 51, .88); color: var(--cream); border-radius: 14px; padding: 4px 12px 2px; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  #bucksPill { font-family: var(--display); font-size: 28px; line-height: 1.15; display: flex; align-items: center; gap: 6px; }
  #bucksPill .coin { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--sun); color: var(--plum); font-size: 18px; border: 2px solid #c98f00; }
  #bucks { font-variant-numeric: tabular-nums; }
  #bucksPill.bump { animation: bump .25s ease-out; }
  @keyframes bump { 40% { transform: scale(1.12); } }
  #malfPill { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
  #malfBar { width: 70px; height: 8px; border-radius: 99px; background: rgba(255,241,218,.2); overflow: hidden; }
  #malfFill { height: 100%; width: 0; background: var(--rubber); border-radius: 99px; transition: width .3s; }
  #malf { font-family: var(--display); font-size: 16px; letter-spacing: 0; font-variant-numeric: tabular-nums; min-width: 3.2em; }

  #utils { position: absolute; top: 12px; right: 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .util { display: flex; align-items: center; gap: 6px; font: 600 13px/1 var(--body); color: var(--cream); background: rgba(43, 27, 51, .88); border: 2px solid transparent; border-radius: 999px; padding: 6px 12px 5px 8px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .util svg { width: 20px; height: 20px; flex: none; }
  .util:hover { border-color: var(--sun); }
  .util.on { background: var(--sun); color: var(--plum); }
  .util:focus-visible, .tool:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  #hint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); max-width: min(420px, calc(100% - 340px)); text-align: center; font-weight: 600; font-size: 15px; line-height: 1.3; padding: 6px 14px 4px; transition: opacity .4s; pointer-events: none; text-wrap: balance; }
  #hint.hide { opacity: 0; }
  #toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s; font-family: var(--display); font-size: 20px; padding: 6px 16px 4px; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%); }

  #tools { flex: none; background: var(--plum); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; border-top: 4px solid #1c1022; }
  .track { display: flex; gap: 8px; width: max-content; margin: 0 auto; padding-top: 6px; }
  .tool { position: relative; width: 70px; height: 76px; border-radius: 16px; border: 3px solid var(--plum-2); background: var(--cream); color: var(--plum); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: 800 11.5px/1.05 var(--body); cursor: pointer; padding: 4px 2px 2px; box-shadow: 0 4px 0 #1c1022; transition: transform .1s; }
  .tool svg { width: 38px; height: 38px; }
  .tool:hover { transform: translateY(-2px); }
  .tool.active { background: var(--sun); border-color: #fff; transform: translateY(-4px); box-shadow: 0 6px 0 #1c1022; }
  .tool.locked { background: var(--plum-2); color: rgba(255,241,218,.7); }
  .tool.locked svg { opacity: .4; filter: grayscale(.6); }
  .tool .price { position: absolute; top: -8px; right: -6px; background: var(--sun); color: var(--plum); font: 800 11px/1 var(--body); padding: 4px 6px 2px; border-radius: 99px; border: 2px solid var(--plum); }
  .tool .key { position: absolute; top: 3px; left: 6px; font-size: 10px; opacity: .45; }
  .tool.deny { animation: deny .35s; }
  @keyframes deny { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

  @media (max-width: 640px) {
    .util span { display: none; }
    .util { padding: 7px; }
    #hint { max-width: calc(100% - 200px); font-size: 13px; }
    #bucksPill { font-size: 22px; }
    .tool { width: 62px; height: 70px; }
    .tool svg { width: 32px; height: 32px; }
    .tool .key { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tool, #toast, #bucksPill.bump { transition: none; animation: none; }
  }
</style>
</head>
<body>
<script type="application/json" id="patch-notes">
[
  { "version": "1.0", "date": "2026-10-05", "title": "Meet Rodney",
    "notes": [
      "A squishy rubber buddy built from soft-body physics. Hard hits leave dents, stretches stay stretched.",
      "11 toys: Hand, Mallet, Taffy Pull, Thumbtack, Bomb, Air Pump, Bowling Ball, Feather, Anvil, Rocket and Magnet.",
      "Earn Bounce Bucks for every hit and spend them on new toys, or switch on Free play.",
      "Reform puts Rodney back in shape. Gravity, slow-mo and sound switches in the top corner.",
      "Keyboard: 1-9 and 0/- pick tools, R reforms, G changes gravity, S slow-mo, M mutes."
    ] }
]
</script>
<div id="app">
  <div id="stageWrap">
    <canvas id="stage" aria-label="Rubber Rodney play area"></canvas>
    <div id="hud">
      <div class="pill" id="bucksPill" title="Bounce Bucks"><span class="coin">$</span><span id="bucks">0</span></div>
      <div class="pill" id="malfPill">Malformed <span id="malfBar"><span id="malfFill" style="display:block"></span></span><span id="malf">0%</span></div>
    </div>
    <div id="utils">
      <button class="util" id="uReform" type="button" aria-label="Reform Rodney (R)" title="Reform Rodney (R)">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M31 15a12 12 0 1 0 1.5 9"/><path d="M32 6v9h-9"/></svg><span>Reform</span></button>
      <button class="util" id="uGrav" type="button" aria-label="Change gravity (G)" title="Change gravity (G)">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v26M11 23l9 9 9-9"/></svg><span id="gravLabel">Gravity: on</span></button>
      <button class="util" id="uSlow" type="button" aria-label="Slow motion (S)" title="Slow motion (S)">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="21" r="13"/><path d="M20 13v8l6 4"/></svg><span>Slow-mo</span></button>
      <button class="util" id="uSound" type="button" aria-label="Sound (M)" title="Sound (M)">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16h6l8-7v22l-8-7H7z"/><path id="waves" d="M27 14a8 8 0 0 1 0 12M31 10a14 14 0 0 1 0 20"/></svg><span id="soundLabel">Sound</span></button>
      <button class="util" id="uClear" type="button" aria-label="Clear toys from the room" title="Clear toys from the room">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h22M16 12V8h8v4M12 12l2 20h12l2-20"/></svg><span>Clear toys</span></button>
      <button class="util" id="uFree" type="button" aria-label="Free play: every toy unlocked" title="Free play: every toy unlocked">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="18" width="22" height="16" rx="3"/><path d="M14 18v-5a6 6 0 0 1 11.5-2.5"/></svg><span>Free play</span></button>
    </div>
    <div class="pill" id="hint">Pick a toy below, then go play with Rodney.</div>
    <div class="pill" id="toast"></div>
  </div>
  <nav id="tools" aria-label="Toys"><div class="track" id="track"></div></nav>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const C = {
  ink: '#2b1b33', rubber: '#ff8a3d', rubberHi: '#ffb27a', cobalt: '#3c6df0', cobaltDk: '#2a4fc0',
  tomato: '#e2363c', glove: '#ffffff', sun: '#ffc933', cream: '#fff1da',
  padLight: '#fbe0e8', padMid: '#f2c5d3', padDark: '#d995ad', seam: '#c47c97', button: '#a35a78',
  floorA: '#2f8f8a', floorB: '#287a76', board: '#5b3a68'
};

// ---------------- DOM ----------------
const wrap = document.getElementById('stageWrap');
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const bucksEl = document.getElementById('bucks');
const bucksPill = document.getElementById('bucksPill');
const malfEl = document.getElementById('malf');
const malfFill = document.getElementById('malfFill');
const hintEl = document.getElementById('hint');
const toastEl = document.getElementById('toast');
const track = document.getElementById('track');

// ---------------- save ----------------
const SAVE_KEY = 'rubber-rodney-v1';
let save = { bucks: 60, unlocked: ['hand', 'mallet', 'taffy'], free: false, muted: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ---------------- audio ----------------
let AC = null, master = null, noiseBuf = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = save.muted ? 0 : 0.55; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!AC || save.muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, ftype, f0, f1, q = 1, delay = 0) {
  if (!AC || save.muted) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = ftype; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  boing(v = 1) { const b = rnd(160, 230); tone('sine', b, b * 3, 0.07, 0.35 * v); tone('sine', b * 3, b * 0.8, 0.3, 0.3 * v, 0.06); },
  thud(v = 1) { tone('sine', 130, 45, 0.18, 0.55 * v); noise(0.09, 0.25 * v, 'lowpass', 500, 120); },
  bonk() { tone('triangle', 420, 110, 0.18, 0.5); tone('square', 900, 300, 0.05, 0.12); noise(0.05, 0.35, 'bandpass', 2400, 900, 2); },
  boom(v = 1) { noise(1.3 * v, 0.9 * v, 'lowpass', 1400, 50); tone('sine', 95, 28, 0.9, 0.8 * v); },
  pop() { noise(0.18, 0.9, 'highpass', 3500, 600); tone('sine', 1100, 90, 0.14, 0.45); },
  clang() { [523, 1307, 1847, 2711].forEach((f, i) => tone('sine', f, f * 0.985, 1.3 - i * 0.22, 0.16)); tone('sine', 120, 50, 0.2, 0.5); },
  tick() { tone('square', 1500, 1500, 0.03, 0.06); },
  hiss() { noise(0.13, 0.12, 'bandpass', 2800, 4200, 1.5); },
  squeak() { tone('sine', 700, 1500, 0.12, 0.14); },
  stretch() { tone('sawtooth', 220, 330, 0.12, 0.05); },
  pin() { tone('square', 1800, 900, 0.04, 0.08); tone('sine', 300, 120, 0.08, 0.3); },
  whoosh() { noise(2.6, 0.35, 'bandpass', 500, 1800, 0.8); },
  buy() { [660, 880, 1320].forEach((f, i) => tone('triangle', f, f, 0.12, 0.25, i * 0.07)); },
  deny() { tone('square', 160, 120, 0.2, 0.12); },
  coin() { tone('triangle', 1760, 1760, 0.06, 0.07); tone('triangle', 2350, 2350, 0.08, 0.06, 0.05); },
  voice(n, high) { const base = high ? 520 : 330; for (let k = 0; k < n; k++) { const f = base * rnd(0.8, 1.3); tone('triangle', f, f * rnd(0.85, 1.15), 0.06, 0.12, k * 0.075); } },
  giggle() { for (let k = 0; k < 4; k++) { const f = 600 + k * 40; tone('triangle', f * 1.2, f, 0.07, 0.13, k * 0.09); } },
  throw() { noise(0.2, 0.15, 'bandpass', 600, 1600, 1); }
};

// ---------------- layout ----------------
let W = 800, H = 600, DPR = 1, floorTop = 500, floorY = 540;
const bgC = document.createElement('canvas'), bgX = bgC.getContext('2d');

function resize() {
  const r = wrap.getBoundingClientRect();
  const oldFloor = floorY;
  W = Math.max(200, r.width); H = Math.max(200, r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const fh = clamp(H * 0.16, 56, 120);
  floorTop = H - fh; floorY = floorTop + fh * 0.45;
  drawBackground();
  if (pts.length) {
    const dy = floorY - oldFloor;
    for (const p of pts) { p.y += dy; p.py += dy; p.x = clamp(p.x, p.r, W - p.r); p.px = clamp(p.px, p.r, W - p.r); if (p.pin) { p.pin.y += dy; p.pin.x = clamp(p.pin.x, 4, W - 4); } }
    for (const o of props) { o.y += dy; o.py += dy; }
  }
}

function drawBackground() {
  bgC.width = cv.width; bgC.height = cv.height;
  const g = bgX; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = C.padMid; g.fillRect(0, 0, W, H);
  // quilted padding
  const S = 64;
  g.save(); g.beginPath(); g.rect(0, 0, W, floorTop); g.clip();
  for (let row = -1; row * (S / 2) < floorTop + S; row++) {
    for (let col = -1; col * S < W + S; col++) {
      const cx = col * S + (row % 2 ? S / 2 : 0), cy = row * (S / 2);
      const grd = g.createRadialGradient(cx - 6, cy - 8, 2, cx, cy, S * 0.62);
      grd.addColorStop(0, C.padLight); grd.addColorStop(0.6, C.padMid); grd.addColorStop(1, C.padDark);
      g.fillStyle = grd;
      g.beginPath(); g.moveTo(cx, cy - S / 2); g.lineTo(cx + S / 2, cy); g.lineTo(cx, cy + S / 2); g.lineTo(cx - S / 2, cy); g.closePath(); g.fill();
      g.strokeStyle = C.seam; g.lineWidth = 1.5; g.stroke();
    }
  }
  for (let row = -1; row * (S / 2) < floorTop + S; row++) {
    for (let col = -1; col * S < W + S; col++) {
      const cx = col * S + (row % 2 ? S / 2 : 0), cy = row * (S / 2) - S / 2;
      g.fillStyle = C.button; g.beginPath(); g.arc(cx, cy, 3.2, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.arc(cx - 1, cy - 1, 1.2, 0, TAU); g.fill();
    }
  }
  g.restore();
  // baseboard
  g.fillStyle = C.board; g.fillRect(0, floorTop - 14, W, 14);
  g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(0, floorTop - 14, W, 3);
  // floor checker with a little perspective
  const fh = H - floorTop, rows = 4, cols = Math.ceil(W / 56) + 2;
  for (let r = 0; r < rows; r++) {
    const y0 = floorTop + fh * Math.pow(r / rows, 1.3), y1 = floorTop + fh * Math.pow((r + 1) / rows, 1.3);
    for (let c = -cols; c < cols * 2; c++) {
      const sx = (t, y) => W / 2 + (c + t - cols / 2) * 56 * (1 + (y - floorTop) / fh * 0.6);
      g.fillStyle = (r + c) % 2 ? C.floorA : C.floorB;
      g.beginPath(); g.moveTo(sx(0, y0), y0); g.lineTo(sx(1, y0), y0); g.lineTo(sx(1, y1), y1); g.lineTo(sx(0, y1), y1); g.closePath(); g.fill();
    }
  }
  const fg = g.createLinearGradient(0, floorTop, 0, H);
  fg.addColorStop(0, 'rgba(0,0,0,.28)'); fg.addColorStop(0.3, 'rgba(0,0,0,0)'); fg.addColorStop(1, 'rgba(0,0,0,.2)');
  g.fillStyle = fg; g.fillRect(0, floorTop, W, fh);
  // vignette
  const v = g.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.3, W / 2, H * 0.5, Math.max(W, H) * 0.8);
  v.addColorStop(0, 'rgba(43,27,51,0)'); v.addColorStop(1, 'rgba(43,27,51,.35)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// ---------------- physics world ----------------
const SUBS = 2, ITERS = 6, G = 0.55;
let h = 0.5, slowmo = false, gravMode = 0;
const pts = [], cons = [], parts = [];
let props = [], rockets = [], particles = [], texts = [];
let fella = null;
let frameImpact = 0, impactX = 0, impactY = 0;
let frameNo = 0;

function addP(x, y, im, r, part) {
  const p = { x, y, px: x, py: y, im, im0: im, r, part, plastic: 0, lvx: 0, lvy: 0, pin: null, held: false, isCenter: false };
  pts.push(p); return p;
}
function link(a, b, k, part, kind) {
  const d = Math.hypot(b.x - a.x, b.y - a.y);
  const c = { a, b, rest: d, rest0: d, k, part, kind };
  cons.push(c); if (part) part.cons.push(c); return c;
}
function polyArea(ring) {
  let a = 0; const n = ring.length;
  for (let i = 0; i < n; i++) { const p = ring[i], q = ring[(i + 1) % n]; a += p.x * q.y - q.x * p.y; }
  return a / 2;
}
function makeBlob(name, cx, cy, rx, ry, n, color) {
  const b = { type: 'blob', name, inflate: 1, popped: false, ring: [], cons: [], color, n };
  b.center = addP(cx, cy, 0.7, 4, b); b.center.isCenter = true;
  for (let i = 0; i < n; i++) { const a = i / n * TAU; b.ring.push(addP(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, 1, 3, b)); }
  for (let i = 0; i < n; i++) {
    link(b.ring[i], b.ring[(i + 1) % n], 0.9, b, 'edge');
    link(b.center, b.ring[i], 0.14, b, 'spoke');
    link(b.ring[i], b.ring[(i + 2) % n], 0.08, b, 'bend');
  }
  b.area0 = polyArea(b.ring); b.target = b.area0;
  parts.push(b); return b;
}
function makeLimb(name, root, segs, thick, color, end) {
  const L = { type: 'limb', name, pts: [root], cons: [], thick, inflate: 1, popped: false, color, end };
  let x = root.x, y = root.y;
  for (const [dx, dy] of segs) { x += dx; y += dy; L.pts.push(addP(x, y, 1, thick / 2, L)); }
  link(L.pts[0], L.pts[1], 0.9, L, 'bone');
  link(L.pts[1], L.pts[2], 0.9, L, 'bone');
  link(L.pts[0], L.pts[2], 0.035, L, 'bendy');
  parts.push(L); return L;
}
function buildFella(cx, cy) {
  pts.length = 0; cons.length = 0; parts.length = 0; rockets = [];
  const torso = makeBlob('torso', cx, cy, 40, 54, 16, C.cobalt);
  const head = makeBlob('head', cx, cy - 94, 46, 44, 18, C.rubber);
  const hr = head.ring, tr = torso.ring;
  link(head.center, torso.center, 0.5, null, 'neck');
  link(hr[4], tr[13], 0.6, null, 'neck'); link(hr[5], tr[11], 0.6, null, 'neck');

let pumping = null;

let magnetOn = false;

function boundPoint(p) {

// ---------------- plasticity, pain, mood ----------------
const mood = { ouch: 0, dizzy: 0, happy: 0, scared: 0, blink: 0, blinkT: 140, idle: 0 };
let bank = 0, pend = 0, pendX = 0, pendY = 0, flushT = 0, malfPct = 0, shakeAmt = 0;
let bubble = null, sayCool = 0, impactCool = 0, reformT = 0;

const LINES = {

function say(cat, force) {

  const text = pick(LINES[cat]);
  bubble = { text, t: 120 }; sayCool = 150;

function afterPhysics() {
  frameNo++;
  const fs = h * SUBS; // sim time this frame, in normal-speed frames
  // plastic yield: any constraint touching a softened point takes its new shape
  for (const c of cons) {
    if (c.a.plastic <= 0 && c.b.plastic <= 0) continue;
    const pt = c.part;
    if (pt && pt.popped && c.kind === 'spoke') continue;
    const s = pt && pt.type === 'blob' && !pt.popped ? pt.inflate : 1;
    const d = Math.hypot(c.b.x - c.a.x, c.b.y - c.a.y), e = effRest(c);

    if (b.ring.some(p => p.plastic > 0) && !b.popped) {

  }

    reformT--;

    if (reformT === 0) { for (const c of cons) c.rest = c.rest0; for (const pt of parts) pt.inflate = 1; fella.head.target = fella.head.area0; fella.torso.target = fella.torso.area0; }

  if (mood.blink > 0) mood.blink--;

      if (Math.random() < 0.3) particles.push({ x: bx, y: by, vx: rnd(-0.5, 0.5), vy: rnd(-1, 0), life: 50, max: 50, c: 'rgba(80,70,90,', s: rnd(6, 12), k: 'smoke' });

      ctx.fillStyle = q.c; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-q.s, -q.s * 0.4); ctx.lineTo(q.s, -q.s * 0.6); ctx.lineTo(q.s * 0.4, q.s * 0.6); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); ctx.globalAlpha = 1;
    } else { ctx.globalAlpha = a; ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.s * (0.5 + a * 0.5), 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
  }
}
function drawTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const t of texts) {
    const p = t.t / t.max, s = t.plain ? 1 : (p < 0.15 ? p / 0.15 * 1.2 : 1.2 - Math.min(0.2, (p - 0.15) * 0.6));
    ctx.save(); ctx.translate(t.x, t.y); ctx.scale(s, s); ctx.rotate(t.plain ? 0 : -0.08);
    ctx.globalAlpha = p > 0.75 ? (1 - p) / 0.25 : 1;
    ctx.font = `${t.size}px ${fontDisplay}`;
    ctx.lineWidth = t.plain ? 5 : 7; ctx.strokeStyle = C.ink; ctx.strokeText(t.text, 0, 0);
    ctx.fillStyle = t.color; ctx.fillText(t.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function roundRect(x, y, w, hgt, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hgt, r); ctx.arcTo(x + w, y + hgt, x, y + hgt, r); ctx.arcTo(x, y + hgt, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawBubble() {
  if (!bubble) return;
  const top = ringAt(fella.head, 300, 1.05);
  ctx.font = `600 16px ${fontBody}`;
  const tw = ctx.measureText(bubble.text).width, bw = tw + 26, bh = 34;
  let bx = top.x + 18, by = top.y - bh - 22;
  if (bx + bw > W - 8) bx = top.x - bw - 18;
  bx = clamp(bx, 8, W - bw - 8); by = clamp(by, 70, H - bh - 8);
  const pop = Math.min(1, (120 - bubble.t) / 6);
  ctx.save(); ctx.globalAlpha = bubble.t < 15 ? bubble.t / 15 : 1;
  ctx.translate(bx + bw / 2, by + bh / 2); ctx.scale(pop, pop); ctx.translate(-bx - bw / 2, -by - bh / 2);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  roundRect(bx, by, bw, bh, 14); ctx.fill(); ctx.stroke();
  const tx = clamp(top.x, bx + 14, bx + bw - 14);
  ctx.beginPath(); ctx.moveTo(tx - 7, by + bh - 1.5); ctx.lineTo(top.x, top.y - 4); ctx.lineTo(tx + 7, by + bh - 1.5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 7, by + bh); ctx.lineTo(top.x, top.y - 4); ctx.lineTo(tx + 7, by + bh); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(bubble.text, bx + bw / 2, by + bh / 2 + 1);
  ctx.restore();
}
function drawShadow() {
  let minX = 1e9, maxX = -1e9, maxY = -1e9;
  for (const p of pts) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); }
  const lift = clamp((floorY - maxY) / 300, 0, 1);
  ctx.fillStyle = `rgba(20,40,40,${0.32 * (1 - lift)})`;
  ctx.beginPath(); ctx.ellipse((minX + maxX) / 2, floorY + 4, (maxX - minX) / 2 * (1 - lift * 0.5) + 10, 10 * (1 - lift * 0.5), 0, 0, TAU); ctx.fill();
  for (const o of props) {
    const ex = o.r || o.hw, l = clamp((floorY - o.y) / 400, 0, 1);
    ctx.fillStyle = `rgba(20,40,40,${0.28 * (1 - l)})`; ctx.beginPath(); ctx.ellipse(o.x, floorY + 3, ex * (1 - l * 0.5), 6, 0, 0, TAU); ctx.fill();
  }
}
function drawCursor() {
  if (!ptr.inside || (!ptr.mouse && !ptr.down)) return;
  const x = ptr.x, y = ptr.y;
  ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (tool === 'mallet') {
    const t = mallet ? mallet.t : 99;
    const ang = t < 4 ? lerp(-1.4, 0.15, t / 4) : t < 16 ? 0.15 - (t - 4) * 0.03 : -0.9;
    ctx.save(); ctx.translate(x + 50, y + 20); ctx.rotate(ang - 0.4);
    ctx.fillStyle = '#c8874a'; roundRect(-4, -60, 8, 64, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.tomato; roundRect(-26, -82, 52, 26, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.45)'; roundRect(-20, -78, 20, 5, 2.5); ctx.fill();
    ctx.restore();
  } else if (tool === 'anvil') {
    ctx.setLineDash([8, 8]); ctx.strokeStyle = 'rgba(43,27,51,.45)'; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, floorY); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(43,27,51,.25)'; ctx.beginPath(); ctx.ellipse(x, floorY + 3, 50, 7, 0, 0, TAU); ctx.fill();
  } else if (tool === 'ball' && aim) {
    const vx = (aim.x - x) * 0.22, vy = (aim.y - y) * 0.22;
    ctx.strokeStyle = 'rgba(43,27,51,.6)'; ctx.setLineDash([2, 10]); ctx.lineWidth = 5;
    ctx.beginPath(); let sx = aim.x, sy = aim.y, svx = clamp(vx, -45, 45), svy = clamp(vy, -45, 45); ctx.moveTo(sx, sy);
    for (let k = 0; k < 24; k++) { sx += svx * 0.8; sy += svy * 0.8; svy += gravity() * 0.8; ctx.lineTo(sx, sy); }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(aim.x, aim.y); ctx.lineTo(x, y); ctx.stroke();
  } else if (tool === 'magnet') {
    if (magnetOn) { for (let k = 0; k < 3; k++) { const r = ((frameNo * 2 + k * 40) % 120) + 20; ctx.strokeStyle = `rgba(226,54,60,${0.5 * (1 - r / 140)})`; ctx.beginPath(); ctx.arc(x, y, 160 - r, 0, TAU); ctx.stroke(); } }
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI);
    ctx.fillStyle = C.tomato; ctx.beginPath(); ctx.moveTo(-16, -18); ctx.lineTo(-16, 0); ctx.arc(0, 0, 16, Math.PI, 0, true); ctx.lineTo(16, -18); ctx.lineTo(7, -18); ctx.lineTo(7, 0); ctx.arc(0, 0, 7, 0, Math.PI, false); ctx.lineTo(-7, -18); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  } else if (tool === 'feather') {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.6 + Math.sin(frameNo * 0.3) * 0.25);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-14, -30, 0, -58); ctx.quadraticCurveTo(14, -30, 0, 0); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, -50); ctx.stroke(); ctx.restore();
  } else if (tool === 'pump') {
    const part = pumping || partAt(x, y);
    ctx.fillStyle = C.cobalt; roundRect(x + 10, y - 6, 22, 12, 4); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 32, y); ctx.quadraticCurveTo(x + 60, y, x + 60, y + 30); ctx.stroke();
    if (part) {
      const lim = part.type === 'blob' ? 2.5 : 3.2, f = clamp((part.inflate - 1) / (lim - 1), 0, 1);
      ctx.fillStyle = 'rgba(43,27,51,.8)'; roundRect(x - 30, y - 34, 60, 12, 6); ctx.fill();
      ctx.fillStyle = f > 0.75 ? C.tomato : C.sun; roundRect(x - 28, y - 32, 56 * f + 2, 8, 4); ctx.fill();
    }
  } else if (tool === 'bomb' || tool === 'pin' || tool === 'rocket') {
    ctx.globalAlpha = 0.5;
    if (tool === 'bomb') drawProp({ kind: 'bomb', x, y, r: 15, fuse: 150 });
    else if (tool === 'pin') drawPin({ x, y });
    ctx.globalAlpha = 1;
    if (tool !== 'bomb') { const p = nearestPoint(x, y, tool === 'pin' ? 40 : 50, false); if (p) { ctx.strokeStyle = C.sun; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, TAU); ctx.stroke(); } }
  } else if ((tool === 'hand' || tool === 'taffy') && !grab && ptr.mouse) {
    const p = nearestPoint(x, y, 45, tool === 'hand');
    if (p) { ctx.strokeStyle = tool === 'taffy' ? C.rubber : '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, 13, 0, TAU); ctx.stroke(); }
  }
  if (grab && grab.taffy) { ctx.fillStyle = 'rgba(255,138,61,.25)'; ctx.beginPath(); ctx.arc(grab.obj.x, grab.obj.y, 80, 0, TAU); ctx.fill(); }
}

let fontDisplay = '"Lilita One", "Arial Rounded MT Bold", sans-serif', fontBody = '"Baloo 2", "Trebuchet MS", sans-serif';

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bgC, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (shakeAmt > 0.3) ctx.translate(rnd(-shakeAmt, shakeAmt), rnd(-shakeAmt, shakeAmt));
  drawShadow();
  for (const pt of fella.drawOrder) {
    if (pt.type === 'blob') { if (pt === fella.torso) drawTorso(pt); else { drawBlob(pt); drawFace(); } }
    else drawLimb(pt);
  }
  for (const p of pts) if (p.pin) drawPin(p);
  for (const rk of rockets) drawRocket(rk);
  for (const o of props) drawProp(o);
  drawParticles();
  drawTexts();
  drawBubble();
  drawCursor();
  if (flash > 0.02) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,250,220,${flash})`; ctx.fillRect(0, 0, cv.width, cv.height); flash *= 0.8; }
}

// ---------------- loop ----------------
let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(100, now - last); last = now; acc += dt;
  const pvx = ptr.x - ptr.lx, pvy = ptr.y - ptr.ly; ptr.vx = pvx; ptr.vy = pvy; ptr.lx = ptr.x; ptr.ly = ptr.y;
  let n = 0;
  while (acc >= 1000 / 60 && n < 4) { step(); acc -= 1000 / 60; n++; }
  if (n === 4) acc = 0;
  draw();
  requestAnimationFrame(loop);
}

function init() {
  resize();
  buildFella(W / 2, floorY - 150);
  bucksEl.textContent = save.bucks;
  buildTools(); selectTool('hand', true); hint('Pick a toy below, then go play with Rodney.');
  document.getElementById('uFree').classList.toggle('on', save.free);
  if (save.muted) { document.getElementById('uSound').classList.add('on'); document.getElementById('soundLabel').textContent = 'Muted'; document.getElementById('waves').style.display = 'none'; }
  updateMalformed();
  new ResizeObserver(() => resize()).observe(wrap);
  requestAnimationFrame(loop);
  setTimeout(() => say('idle', true), 1200);
}
init();
})();
</script>
