<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Projects</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --accent: #6c4cf5; --border: #e3e1dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1f1f23; --text: #f1f1f3; --muted: #9a9aa2;
      --accent: #9b85ff; --border: #2e2e34;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { max-width: 960px; margin: 0 auto; padding: 40px 16px 8px; }
  h1 { margin: 0 0 4px; font-size: 2rem; }
  #search {
    margin-top: 20px; width: 100%; padding: 10px 14px; font: inherit;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text);
  }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  }
  .card {
    display: block; overflow: hidden; border-radius: 14px; text-decoration: none;
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    transition: transform .12s, border-color .12s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card .thumb {
    aspect-ratio: 16 / 9; display: grid; place-items: center;
    font-size: 2.5rem; background: var(--border);
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .info { padding: 12px 16px 14px; }
  .card .name { font-weight: 600; }
  .card .file { color: var(--muted); font-size: .85rem; }
  #status, .empty { color: var(--muted); }
  .shelf h2 { font-size: 1.3rem; margin: 28px 0 12px; }

  /* Patch notes */
  #notes h2 { font-size: 1.3rem; margin: 40px 0 12px; }
  .entry { padding: 14px 0; border-top: 1px solid var(--border); }
  .entry time { color: var(--muted); font-size: .85rem; }
  .entry .text { margin: 4px 0 0; white-space: pre-line; }
  .entry .title { margin: 4px 0 0; font-size: 1rem; }
  .entry ul { margin: 6px 0 0; padding-left: 20px; }
  .entry li + li { margin-top: 3px; }
  .entry .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag {
    font-size: .8rem; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .tag.added { color: var(--accent); border-color: var(--accent); }

  /* Player overlay */
  #player {
    position: fixed; inset: 0; display: none; flex-direction: column;
    background: var(--bg); z-index: 10;
  }
  #player.open { display: flex; }
  #bar {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); background: var(--card);
  }
  #bar a, #bar button {
    font: inherit; color: var(--accent); background: none; border: 0;
    cursor: pointer; text-decoration: none; padding: 4px 6px;
  }
  #bar .title { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #frame { flex: 1; width: 100%; border: 0; background: #fff; }
  footer { max-width: 960px; margin: 0 auto; padding: 32px 16px 40px; color: var(--muted); font-size: .85rem; }
</style>
<!-- Anonymous visit counting (no cookies): https://oisingrace.goatcounter.com -->
<script data-goatcounter="https://oisingrace.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header>
  <h1>My Projects</h1>
  <input id="search" type="search" placeholder="Search…" autocomplete="off">
</header>
<main>
  <p id="status">Loading…</p>
  <section class="shelf">
    <h2>Games</h2>
    <div class="grid" id="grid-games"></div>
    <p class="empty" id="empty-games" hidden></p>
  </section>
  <section class="shelf">
    <h2>Experiments</h2>
    <div class="grid" id="grid-experiments"></div>
    <p class="empty" id="empty-experiments" hidden></p>
  </section>
  <section id="notes" hidden>
    <h2>Patch notes</h2>
    <div id="noteList"></div>
  </section>
</main>
<footer>This site counts visits anonymously.</footer>

<div id="player">
  <div id="bar">
    <button id="back">← Back</button>
    <span class="title" id="playerTitle"></span>
    <a id="newTab" target="_blank" rel="noopener">Open full page ↗</a>
  </div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
</div>

<script>
/*
 * Drop any .html file into the /games or /experiments folder and it shows up
 * here automatically, under the matching heading. Nothing in this file needs
 * to change when you add one.
 *
 * The lists come from games.json and experiments.json (written by the GitHub
 * Action on every push). The card title is the file's own <title>, falling
 * back to the file name.
 *
 * Card pictures come from screenshots/<games|experiments>/<name>.jpg, e.g.
 * screenshots/games/smash-lot.jpg. A game without one gets an emoji instead.
 */
const SECTIONS = [
  { key: 'games', dir: 'games/', list: 'games.json', countAs: '/game/' },
  { key: 'experiments', dir: 'experiments/', list: 'experiments.json', countAs: '/experiment/' },
];
const EMOJIS = ['🕹️','👾','🎲','🧩','🚀','🐍','🏓','🎯','🃏','🌀','⭐','🔥'];

const status = document.getElementById('status');
const search = document.getElementById('search');
const player = document.getElementById('player');
const frame = document.getElementById('frame');
let games = [];

function prettyName(file) {
  return file.replace(/\.html?$/i, '').replace(/[-_]+/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

function emojiFor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return EMOJIS[h % EMOJIS.length];
}

async function loadList(section) {
  const res = await fetch(section.list, { cache: 'no-cache' });
  if (!res.ok) {
    if (section.key === 'games') throw new Error(section.list + ' not found');
    return [];  // no experiments yet
  }
  return (await res.json()).map(file => {
    const name = file.replace(/\.html?$/i, '');
    return {
      file, section, src: section.dir + encodeURIComponent(file),
      shot: 'screenshots/' + section.key + '/' + encodeURIComponent(name) + '.jpg',
      // Games keep their short links (#smash-lot); experiments get #experiments/<name>.
      slug: section.key === 'games' ? name : section.key + '/' + name,
      name: prettyName(file),
    };
  });
}

async function titleOf(g) {
  try {
    const html = await (await fetch(g.src)).text();
    const m = html.match(/<title[^>]*>([^<]*)<\/title>/i);
    const t = m && m[1].trim();
    return t || prettyName(g.file);
  } catch { return prettyName(g.file); }
}

function render() {
  const q = search.value.trim().toLowerCase();
  for (const section of SECTIONS) {
    const items = games.filter(g => g.section === section);
    const shown = items.filter(g => (g.name + ' ' + g.file).toLowerCase().includes(q));
    renderGrid(section, shown);
    const empty = document.getElementById('empty-' + section.key);
    empty.textContent = items.length === 0
      ? 'Nothing here yet — add an .html file to the ' + section.key + ' folder.'
      : shown.length === 0 ? 'No matches.' : '';
    empty.hidden = !empty.textContent;
  }
  status.textContent = '';
}

function renderGrid(section, shown) {
  const grid = document.getElementById('grid-' + section.key);
  grid.innerHTML = '';
  for (const g of shown) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = '#' + g.slug.split('/').map(encodeURIComponent).join('/');
    a.innerHTML = '<div class="thumb"><img alt="" loading="lazy"></div>'
      + '<div class="info"><div class="name"></div><div class="file"></div></div>';
    const img = a.querySelector('img');
    img.onerror = () => { img.parentNode.textContent = emojiFor(g.slug); };
    img.src = g.shot;
    a.querySelector('.name').textContent = g.name;
    a.querySelector('.file').textContent = g.file;
    grid.appendChild(a);
  }
}

// Patch notes: patchnotes.json is built from the history of the games folder.
// Each entry's time is when it was committed; the text is the commit message.
// Games that carry their own notes (see .github/scripts/build.py) add one
// entry per version instead: a date, a title and a list.
async function renderNotes() {
  let notes;
  try {
    const res = await fetch('patchnotes.json', { cache: 'no-cache' });
    if (!res.ok) return;
    notes = await res.json();
  } catch { return; }
  notes.sort((a, b) => new Date(b.time) - new Date(a.time));
  const nameOf = file => (games.find(g => g.file === file) || {}).name || prettyName(file);
  const list = document.getElementById('noteList');
  list.innerHTML = '';
  for (const n of notes) {
    const el = document.createElement('article');
    el.className = 'entry';
    const time = document.createElement('time');
    time.dateTime = n.time;
    // Games' own notes have a date only; commits have a date and time.
    time.textContent = n.dateOnly
      ? new Date(n.time).toLocaleDateString(undefined, { dateStyle: 'medium', timeZone: 'UTC' })
      : new Date(n.time).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    el.appendChild(time);
    if (n.title) {
      const h = document.createElement('h3');
      h.className = 'title';
      h.textContent = n.title;
      el.appendChild(h);
    }
    if (n.items && n.items.length) {
      const ul = document.createElement('ul');
      for (const item of n.items) {
        const li = document.createElement('li');
        li.textContent = item;
        ul.appendChild(li);
      }
      el.appendChild(ul);
    }
    if (n.note) {
      const p = document.createElement('p');
      p.className = 'text';
      p.textContent = n.note;
      el.appendChild(p);
    }
    const tags = document.createElement('div');
    tags.className = 'tags';
    for (const kind of ['added', 'updated', 'removed']) {
      for (const file of n[kind]) {
        const t = document.createElement('span');
        t.className = 'tag ' + kind;
        t.textContent = kind[0].toUpperCase() + kind.slice(1) + ': ' + nameOf(file);
        tags.appendChild(t);
      }
    }
    if (tags.children.length) el.appendChild(tags);
    list.appendChild(el);
  }
  document.getElementById('notes').hidden = notes.length === 0;
}

// Count each game opened as its own page (/game/<name> or /experiment/<name>)
// in GoatCounter.
// The counter script loads async, so retry briefly until it's ready.
let lastCounted = null;
function countGame(g, tries = 20) {
  if (lastCounted === g.slug) return;
  const gc = window.goatcounter;
  if (gc && gc.count) {
    lastCounted = g.slug;
    gc.count({ path: g.section.countAs + g.file.replace(/\.html?$/i, ''), title: g.name });
  } else if (tries > 0) {
    setTimeout(() => countGame(g, tries - 1), 500);
  }
}

function route() {
  const slug = decodeURIComponent(location.hash.slice(1));
  const g = games.find(g => g.slug === slug);
  if (g) {
    const src = g.src;
    if (frame.getAttribute('src') !== src) frame.src = src;
    document.getElementById('playerTitle').textContent = g.name;
    document.getElementById('newTab').href = src;
    document.title = g.name + ' · My Projects';
    player.classList.add('open');
    frame.focus();
    countGame(g);
  } else {
    lastCounted = null;
    player.classList.remove('open');
    frame.removeAttribute('src');
    document.title = 'My Projects';
  }
}

document.getElementById('back').onclick = () => { location.hash = ''; };
search.oninput = render;
window.onhashchange = route;

(async () => {
  try {
    games = (await Promise.all(SECTIONS.map(loadList))).flat();
    render();
    route();
    // Upgrade names to each game's <title> once they load.
    await Promise.all(games.map(async g => { g.name = await titleOf(g); }));
    render();
    route();
    renderNotes();
  } catch (e) {
    status.textContent = 'Could not load the game list (' + e.message + ').';
  }
})();
</script>
</body>
</html>
